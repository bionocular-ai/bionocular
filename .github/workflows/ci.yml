name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      id: setup-python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v6
      with:
        path: melanoma/.venv
        key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('melanoma/poetry.lock') }}
    
    - name: Install dependencies
      working-directory: ./melanoma
      run: poetry install --no-interaction --no-root
    
    - name: Lint with ruff
      working-directory: ./melanoma
      run: poetry run ruff check src/ tests/
    
    - name: Format check with black
      working-directory: ./melanoma
      run: poetry run black --check src/ tests/
    
    - name: Type check with mypy
      working-directory: ./melanoma
      run: poetry run mypy src/
    
    - name: Run tests with pytest
      working-directory: ./melanoma
      run: poetry run pytest tests/ --cov=src --cov-report=xml --cov-report=html
    
    - name: Security audit with bandit
      working-directory: ./melanoma
      run: poetry run bandit -r src/ -f json -o bandit-report.json || true
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./melanoma/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npx tsc --noEmit

    - name: Build
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    - name: Security audit
      run: npm audit --audit-level=high

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      working-directory: ./melanoma
      run: poetry install --no-interaction --no-root
    
    - name: Build package
      working-directory: ./melanoma
      run: poetry build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: melanoma/dist/
