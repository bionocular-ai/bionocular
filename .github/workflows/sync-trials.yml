name: Sync ClinicalTrials.gov

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily (~03:00 CET / 04:00 CEST)
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback days (ignored if full=true)'
        default: '2'
      full:
        description: 'Full refresh (no date filter)'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache venv
        id: cached-poetry-dependencies
        uses: actions/cache@v3
        with:
          path: melanoma/.venv
          key: venv-sync-${{ runner.os }}-py3.11-${{ hashFiles('melanoma/poetry.lock') }}

      - name: Install dependencies (main only)
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        working-directory: ./melanoma
        run: poetry install --no-interaction --no-root --only main

      - name: Run sync
        working-directory: ./melanoma
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          ARGS="--days ${{ github.event.inputs.days || '2' }}"
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            ARGS="$ARGS --full"
          fi
          poetry run python3 scripts/sync_trials_supabase.py $ARGS
