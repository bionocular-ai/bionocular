[tool.poetry]
name = "melanoma"
version = "0.1.0"
description = "Melanoma ingestion system for Bionocular organization"
authors = ["Bionocular Team <team@bionocular.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
# Core API dependencies (lightweight for production)
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
sqlalchemy = "^2.0.23"
psycopg2-binary = "^2.9.9"
python-multipart = "^0.0.6"
python-dotenv = "^1.0.0"
alembic = "^1.12.1"
requests = "^2.31.0"
tenacity = "^9.1.2"
psutil = "^7.1.3"
# Lightweight langchain for API calls only (if needed)
langchain-openai = "^0.3.33"
google-genai = ">=1.4.0"
supabase = "^2.28.3"
langchain-google-genai = "<2.0"
# News scraper dependencies
feedparser = "^6.0.12"
beautifulsoup4 = "^4.14.3"
lxml = "^6.1.0"

[tool.poetry.group.processing]
optional = true

[tool.poetry.group.processing.dependencies]
# Heavy dependencies for LOCAL PDF processing and embedding generation only
# These should NOT be installed in production/Render deployment
pypdf2 = "^3.0.1"
pdfplumber = "^0.10.3"
marker-pdf = "1.8.2"
sentence-transformers = "^2.7.0"
chromadb = ">=0.5.0"
numpy = ">=2.1.0"
langchain = "^0.3.27"
langchain-community = "^0.3.29"
langchain-huggingface = "^0.3.1"
langchain-chroma = "^0.2.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
httpx = ">=0.28.0"
black = "^23.11.0"
ruff = "^0.1.6"
mypy = "^1.7.1"
bandit = "^1.7.5"
types-pyyaml = "^6.0.12.20250915"
types-requests = "^2.31.0.20240125"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py39"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.poetry.scripts]
# Development tasks
dev-install = "scripts.dev:install_dependencies"
dev-test = "scripts.dev:run_tests"
dev-test-cov = "scripts.dev:run_tests_with_coverage"
dev-lint = "scripts.dev:run_linting"
dev-format = "scripts.dev:format_code"
dev-type-check = "scripts.dev:run_type_checking"
dev-quality = "scripts.dev:run_all_quality_checks"
dev-build = "scripts.dev:build_project"
dev-run = "scripts.dev:run_application"
dev-db-init = "scripts.dev:initialize_database"
dev-clean = "scripts.dev:clean_project"

# CI/CD tasks
ci-test = "scripts.ci:run_ci_tests"
ci-build = "scripts.ci:build_for_ci"
ci-deploy = "scripts.ci:deploy_project"
