# RAG Query Templates - Optimized for ASCO/ESMO Clinical Trial Abstracts
# Version 2 - Enhanced based on abstract analysis
#
# All queries are based on patterns found in melanoma/data/postprocessed/ and provided abstracts
# Each attribute has 4-7+ context-focused query variations
#
# Last Updated: Based on ASCO_2020.md & ESMO_2020.md analysis
# Coverage: 114/114 attributes (100%)

# ============================================================================
# GENERAL PARAMETERS (Abstract-level)
# ============================================================================

# NOTE: conference and published_year are extracted from file path - no RAG queries needed
# NOTE: abstract_number uses fixed section: abstract_id - no RAG queries needed
# NOTE: comments uses fixed section: full_text_reference - no RAG queries needed

trial_name:
  # Simple pattern matching: Look for Keynote, Checkmate, or Masterkey patterns
  - "Keynote"
  - "Checkmate"
  - "Masterkey"

