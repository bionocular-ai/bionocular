# ============================================================================
# CLINICAL TRIAL IDENTIFIERS
# ============================================================================

nct_number:
  # Abstract-style queries (ESMO/ASCO)
  - "Clinical trial identification:" # ESMO section header (without markdown)
  - "Clinical Trial Information:" # ASCO section header (without markdown)
  - "Clinical trial identification NCT" # Section with NCT
  - "Clinical trial information NCT" # Common header
  # Publication-style queries (based on actual publication patterns)
  - "Clinical trial information:" # Publication format: "Clinical trial information: NCT02267603"
  - "Clinical trial information NCT" # Direct pattern: "Clinical trial information: NCT02267603"
  - "Clinical trial registration" # Publication format: "Clinical trial registration NCT02519322"
  - "Clinicaltrials.gov" # Publication format: "Clinicaltrials.gov, NCT02760498"
  - "ClinicalTrials.gov identifier" # Publication format: "ClinicalTrials.gov identifier: NCT02267603"
  - "ClinicalTrials.gov identifier NCT" # Direct pattern: "identifier: NCT02267603"
  - "ClinicalTrials.gov number" # Publication format: "ClinicalTrials.gov number, NCT00094653"
  - "ClinicalTrials.gov number NCT" # Publication format with NCT
  - "trial registration NCT" # Generic registration pattern
  - "clinical trial identifier NCT" # Generic identifier pattern
  - "NCT12345678" # Direct NCT pattern (will match any NCT)
  - "NCT number clinical trial" # Generic pattern
  # Generic queries (work for both abstracts and publications)
  - "NCT followed by 8 digits"
  - "NCT number study information"
  - "EudraCT number" # Added European equivalent
  # Direct NCT pattern queries (for embedded NCT numbers in text)
  - "NCT" # Simple pattern for embedded NCT numbers like "(NCT02383212)"

